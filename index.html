<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบติดตามแปลงเกษตร เขตประเวศ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Thai",sans-serif;background:#f4f7f5;color:#173b2a}
header{background:#176b43;color:#fff;padding:16px 22px}header h1{margin:0;font-size:21px}
.wrap{max-width:1400px;margin:auto;padding:16px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button,select,input,textarea{font:inherit}button{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;background:#176b43;color:#fff}
button.secondary{background:#e8f0eb;color:#174c35}select,input,textarea{padding:9px;border:1px solid #cbd8d0;border-radius:8px;background:#fff}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.card{background:#fff;border:1px solid #dce7e0;border-radius:14px;padding:16px;box-shadow:0 2px 10px #0000000a}
#map{height:560px;border-radius:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.stat{background:#eef6f1;padding:13px;border-radius:10px}.stat b{display:block;font-size:24px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:13px;font-weight:700;margin:9px 0 5px}
.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:700}.ok{background:#dff3e7;color:#176b43}.wait{background:#fff0d4;color:#8a5b00}.no{background:#f8dddd;color:#9a2929}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #e5ece8;text-align:left}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.photo{width:110px;height:80px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
.muted{color:#60756a;font-size:13px}.error{background:#fff0f0;color:#9a2929;padding:10px;border-radius:8px;margin:8px 0}.success{background:#e9f8ef;color:#176b43;padding:10px;border-radius:8px;margin:8px 0}
.hidden{display:none!important}@media(max-width:900px){.grid{grid-template-columns:1fr}#map{height:430px}.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🌾 ระบบติดตามแปลงเกษตร เขตประเวศ</h1></header>
<main class="wrap">
<div id="message"></div>
<div class="stats">
<div class="stat">แปลงทั้งหมด<b id="total">0</b></div>
<div class="stat">ตรวจแล้ว<b id="visited">0</b></div>
<div class="stat">ยังเป็นเกษตร<b id="agri">0</b></div>
<div class="stat">รอตรวจ<b id="waiting">0</b></div>
</div>
<div class="toolbar">
<label style="margin:0;display:flex;align-items:center;gap:6px">ปีภาษี
<select id="year"></select></label>
<input id="search" placeholder="ค้นหารหัสแปลง / เลขเอกสารสิทธิ์" style="max-width:280px">
<button id="findPlot">🔎 ค้นหา</button><button id="reload">↻ รีเฟรช</button>
</div>
<div class="grid">
<section class="card">
<h3>🗺️ แผนที่แปลงเกษตร</h3>
<div id="map"></div>
<div id="plotList" style="margin-top:12px"></div>
</section>
<section class="card">
<h3 id="title">เลือกแปลงจากแผนที่</h3>
<div id="detail"><div class="muted">เลือกจุดบนแผนที่หรือรายการด้านล่าง</div></div>
</section>
</div>
</main>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
const SUPABASE_URL="https://zcyymemnbvodhayehkdn.supabase.co";
const SUPABASE_KEY="sb_publishable_XVP0B8KvPBFyZtIi_K3z4A_cRTTmAGH";
const YEARS=[2568,2569,2570,2571,2572];
const $=id=>document.getElementById(id);
let db, map, plots=[], inspections=[], selected=null, markers=[];

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function status(i){if(!i||!i.visited)return ["wait","ยังไม่ได้ลงพื้นที่"];return i.is_agricultural===true?["ok","ตรวจแล้ว • ยังเป็นเกษตร"]:["no","ตรวจแล้ว • ไม่เป็นเกษตร"];}
function inspectionFor(plotId){return inspections.find(x=>x.plot_id===plotId);}
function showMsg(text,type="error"){ $("message").innerHTML='<div class="'+type+'">'+esc(text)+'</div>';setTimeout(()=>{if($("message").textContent===text)$("message").innerHTML=""},5000);}

async function init(){
  try{
    if(!window.supabase)throw new Error("ไม่สามารถโหลด Supabase ได้");
    if(!window.L)throw new Error("ไม่สามารถโหลดแผนที่ได้");
    db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    map=L.map("map").setView([13.6748,100.687],14);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles © Esri"}).addTo(map);
    $("year").innerHTML=YEARS.map(y=>'<option value="'+y+'" '+(y===2569?"selected":"")+'>ปีภาษี '+y+"</option>").join("");
    $("year").addEventListener("change",loadInspections);
    $("search").addEventListener("input",renderList);
    $("search").addEventListener("keydown",e=>{if(e.key==="Enter")findPlot();});
    $("findPlot").addEventListener("click",findPlot);
    $("reload").addEventListener("click",loadAll);
    await loadAll();
  }catch(e){showMsg("เปิดระบบไม่สำเร็จ: "+e.message);}
}
async function loadAll(){
  $("detail").innerHTML='<div class="muted">กำลังโหลดข้อมูล...</div>';
  const {data,error}=await db.from("plots").select("*").order("plot_code");
  if(error){showMsg(error.message);return;}
  plots=data||[];
  await loadInspections();
}
async function loadInspections(){
  const y=Number($("year").value);
  const {data,error}=await db.from("inspections").select("*").eq("tax_year",y);
  if(error){showMsg(error.message);return;}
  inspections=data||[];
  render();
  if(selected)await openPlot(selected.id);
}
function render(){
  renderMap();renderList();renderStats();
}
function renderMap(){
  markers.forEach(m=>m.remove());markers=[];
  const bounds=[];
  for(const p of plots){
    if(p.latitude==null||p.longitude==null)continue;
    const i=inspectionFor(p.id),s=status(i),color=s[0]==="ok"?"#176b43":s[0]==="no"?"#a83d3d":"#d49a19";
    const m=L.circleMarker([p.latitude,p.longitude],{radius:9,color,fillColor:color,fillOpacity:.85});
    m.bindPopup("<b>"+esc(p.plot_code)+"</b><br>"+esc(s[1]));
    m.on("click",()=>openPlot(p.id));m.addTo(map);markers.push(m);bounds.push([p.latitude,p.longitude]);
  }
  if(bounds.length)map.fitBounds(bounds,{padding:[25,25]});
}
function findPlot(){
  const q=$("search").value.trim().toLowerCase();
  if(!q){showMsg("กรุณาระบุรหัสแปลงหรือเลขเอกสารสิทธิ์");return;}
  const rows=plots.filter(p=>(String(p.plot_code)+" "+String(p.title_deed_no||"")).toLowerCase().includes(q));
  if(!rows.length){showMsg("ไม่พบแปลงที่ตรงกับคำค้น");return;}
  const p=rows[0];
  if(p.latitude!=null&&p.longitude!=null){
    map.setView([p.latitude,p.longitude],17);
    const m=markers.find(x=>x.getLatLng().lat===Number(p.latitude)&&x.getLatLng().lng===Number(p.longitude));
    if(m)m.openPopup();
  }
  openPlot(p.id);
  if(rows.length>1)showMsg("พบ "+rows.length+" แปลง แสดงแปลงแรกคือ "+p.plot_code+" สามารถเลือกแปลงอื่นจากรายการด้านล่าง","success");
}
function renderList(){
  const q=$("search").value.trim().toLowerCase();
  const rows=plots.filter(p=>(String(p.plot_code)+" "+String(p.title_deed_no||"")).toLowerCase().includes(q));
  $("plotList").innerHTML='<table><tr><th>แปลง</th><th>เอกสารสิทธิ์</th><th>สถานะปี '+$("year").value+'</th></tr>'+
    rows.map(p=>{const s=status(inspectionFor(p.id));return '<tr data-id="'+p.id+'" style="cursor:pointer"><td><b>'+esc(p.plot_code)+'</b></td><td>'+esc(p.title_deed_no||"-")+'</td><td><span class="badge '+s[0]+'">'+s[1]+'</span></td></tr>';}).join("")+
    "</table>";
  $("plotList").querySelectorAll("tr[data-id]").forEach(r=>r.addEventListener("click",()=>openPlot(r.dataset.id)));
}
function renderStats(){
  const v=inspections.filter(i=>i.visited).length;
  const a=inspections.filter(i=>i.visited&&i.is_agricultural===true).length;
  $("total").textContent=plots.length;$("visited").textContent=v;$("agri").textContent=a;$("waiting").textContent=Math.max(0,plots.length-v);
}
async function openPlot(id){
  selected=plots.find(p=>p.id===id);if(!selected)return;
  const y=Number($("year").value);
  const current=inspectionFor(id)||{plot_id:id,tax_year:y,visited:false,is_agricultural:null,inspection_date:"",inspector_name:"",notes:""};
  const {data:history,error}=await db.from("inspections").select("*").eq("plot_id",id).order("tax_year",{ascending:false});
  if(error){showMsg(error.message);return;}
  const s=status(current);
  $("title").textContent="แปลง "+selected.plot_code+" • ปีภาษี "+y;
  $("detail").innerHTML=
    '<div class="success"><span class="badge '+s[0]+'">'+s[1]+'</span></div>'+
    '<div class="row"><div><label>รหัสแปลง</label><input value="'+esc(selected.plot_code)+'" disabled></div><div><label>เลขเอกสารสิทธิ์</label><input value="'+esc(selected.title_deed_no||"")+'" disabled></div></div>'+
    '<div class="row"><div><label>พิกัด</label><input value="'+selected.latitude+', '+selected.longitude+'" disabled></div><div><label>เนื้อที่</label><input value="'+(selected.area_rai||0)+"-"+(selected.area_ngan||0)+"-"+(selected.area_wah||0)+'" disabled></div></div>'+
    '<div class="row"><div><label>แขวง/ตำบล</label><input id="pSub" value="'+esc(selected.subdistrict||"")+'"></div><div><label>เขต</label><input id="pDistrict" value="'+esc(selected.district||"")+'"></div></div>'+
    '<div class="row"><div><label>การใช้ประโยชน์ที่ดิน</label><input id="pLand" value="'+esc(selected.land_use||"")+'"></div><div><label>ชนิดพืช</label><input id="pCrop" value="'+esc(selected.crop||"")+'"></div></div>'+
    '<div class="toolbar" style="margin-top:10px"><button id="savePlotDetails">💾 บันทึกข้อมูลแปลง</button></div>'+
    '<label>ลงพื้นที่ตรวจแล้วหรือยัง</label><select id="fVisited"><option value="false" '+(!current.visited?"selected":"")+'>ยังไม่ได้ลงพื้นที่</option><option value="true" '+(current.visited?"selected":"")+'>ลงพื้นที่แล้ว</option></select>'+
    '<label>สถานะการเกษตร</label><select id="fAgri"><option value="" '+(current.is_agricultural==null?"selected":"")+'>ยังไม่ระบุ</option><option value="true" '+(current.is_agricultural===true?"selected":"")+'>ยังเป็นเกษตร</option><option value="false" '+(current.is_agricultural===false?"selected":"")+'>ไม่เป็นเกษตร</option></select>'+
    '<div class="row"><div><label>วันที่ตรวจ</label><input id="fDate" type="date" value="'+esc(current.inspection_date||"")+'"></div><div><label>ผู้ตรวจ</label><input id="fInspector" value="'+esc(current.inspector_name||"")+'"></div></div>'+
    '<label>หมายเหตุ</label><textarea id="fNotes">'+esc(current.notes||"")+'</textarea>'+
    '<label>รูปถ่ายปี '+y+'</label><input id="fPhotos" type="file" accept="image/*" multiple><div id="photos" class="photos"></div>'+
    '<div class="toolbar" style="margin-top:12px"><button id="save">💾 บันทึกข้อมูลปี '+y+'</button><button class="secondary" id="maps">📍 Google Maps</button></div>'+
    '<hr><h4>ประวัติการตรวจย้อนหลัง</h4>'+
    '<table><tr><th>ปี</th><th>สถานะ</th><th>วันที่</th><th>ผู้ตรวจ</th></tr>'+
    (history||[]).map(h=>{const z=status(h);return "<tr><td>"+h.tax_year+"</td><td>"+z[1]+"</td><td>"+(h.inspection_date||"-")+"</td><td>"+esc(h.inspector_name||"-")+"</td></tr>";}).join("")+"</table>";
  $("save").addEventListener("click",saveInspection);
  $("savePlotDetails").addEventListener("click",savePlotDetails);
  $("maps").addEventListener("click",()=>window.open("https://www.google.com/maps?q="+selected.latitude+","+selected.longitude,"_blank"));
  await loadPhotos(current.id);
}
function showPlotEditor(p){
  const d=$("detail");
  d.innerHTML='<h4>✏️ แก้ไขข้อมูลแปลง '+esc(p.plot_code)+'</h4>'+
    '<div class="row"><div><label>รหัสแปลง</label><input id="pCode" value="'+esc(p.plot_code)+'"></div><div><label>เลขเอกสารสิทธิ์</label><input id="pDeed" value="'+esc(p.title_deed_no||"")+'"></div></div>'+
    '<div class="row"><div><label>ละติจูด</label><input id="pLat" type="number" step="any" value="'+(p.latitude??"")+'"></div><div><label>ลองจิจูด</label><input id="pLng" type="number" step="any" value="'+(p.longitude??"")+'"></div></div>'+
    '<div class="row"><div><label>ไร่</label><input id="pRai" type="number" min="0" value="'+(p.area_rai??0)+'"></div><div><label>งาน</label><input id="pNgan" type="number" min="0" value="'+(p.area_ngan??0)+'"></div></div>'+
    '<label>ตารางวา</label><input id="pWah" type="number" min="0" step="0.01" value="'+(p.area_wah??0)+'">'+
    '<div class="row"><div><label>แขวง/ตำบล</label><input id="pSub" value="'+esc(p.subdistrict||"")+'"></div><div><label>เขต/อำเภอ</label><input id="pDistrict" value="'+esc(p.district||"")+'"></div></div>'+
    '<div class="row"><div><label>การใช้ประโยชน์ที่ดิน</label><input id="pLand" value="'+esc(p.land_use||"")+'"></div><div><label>ชนิดพืช</label><input id="pCrop" value="'+esc(p.crop||"")+'"></div></div>'+
    '<div class="toolbar" style="margin-top:12px"><button id="savePlot">💾 บันทึกข้อมูลแปลง</button><button class="secondary" id="cancelPlot">ยกเลิก</button></div>';
  $("savePlot").addEventListener("click",savePlot);
  $("cancelPlot").addEventListener("click",()=>openPlot(p.id));
}
async function savePlot(){
  const code=$("pCode").value.trim();
  if(!code){showMsg("กรุณาระบุรหัสแปลง");return;}
  const payload={plot_code:code,title_deed_no:$("pDeed").value.trim()||null,
    latitude:$("pLat").value===""?null:Number($("pLat").value),longitude:$("pLng").value===""?null:Number($("pLng").value),
    area_rai:$("pRai").value===""?0:Number($("pRai").value),area_ngan:$("pNgan").value===""?0:Number($("pNgan").value),area_wah:$("pWah").value===""?0:Number($("pWah").value),
    subdistrict:$("pSub").value.trim()||null,district:$("pDistrict").value.trim()||null,land_use:$("pLand").value.trim()||null,crop:$("pCrop").value.trim()||null,updated_at:new Date().toISOString()};
  const {data,error}=await db.from("plots").update(payload).eq("id",selected.id).select().single();
  if(error){showMsg("บันทึกข้อมูลแปลงไม่สำเร็จ: "+error.message);return;}
  const idx=plots.findIndex(x=>x.id===selected.id);if(idx>=0)plots[idx]=data;selected=data;
  showMsg("บันทึกข้อมูลแปลงเรียบร้อยแล้ว","success");render();await openPlot(data.id);
}

async function savePlotDetails(){
  if(!selected)return;
  const payload={
    subdistrict:$("pSub").value.trim()||null,
    district:$("pDistrict").value.trim()||null,
    land_use:$("pLand").value.trim()||null,
    crop:$("pCrop").value.trim()||null,
    updated_at:new Date().toISOString()
  };
  const {data,error}=await db.from("plots").update(payload).eq("id",selected.id).select().single();
  if(error){showMsg("บันทึกข้อมูลแปลงไม่สำเร็จ: "+error.message);return;}
  const idx=plots.findIndex(x=>x.id===selected.id);
  if(idx>=0)plots[idx]=data;
  selected=data;
  showMsg("บันทึกข้อมูลแปลงเรียบร้อยแล้ว","success");
  render();
  await openPlot(data.id);
}

async function loadPhotos(inspectionId){
  const box=$("photos");if(!box)return;
  if(!inspectionId){box.innerHTML='<span class="muted">ยังไม่มีการบันทึกของปีนี้</span>';return;}
  const {data,error}=await db.from("inspection_photos").select("*").eq("inspection_id",inspectionId).order("uploaded_at");
  if(error){box.innerHTML='<span class="error">'+esc(error.message)+"</span>";return;}
  if(!data?.length){box.innerHTML='<span class="muted">ยังไม่มีรูป</span>';return;}
  const items=[];
  for(const p of data){const {data:u}=await db.storage.from("inspection-photos").createSignedUrl(p.storage_path,3600);if(u?.signedUrl)items.push('<a href="'+u.signedUrl+'" target="_blank"><img class="photo" src="'+u.signedUrl+'" alt="'+esc(p.file_name||"รูป")+'"></a>');}
  box.innerHTML=items.join("")||'<span class="muted">ยังไม่มีรูปที่เปิดดูได้</span>';
}
async function saveInspection(){
  if(!selected)return;
  const y=Number($("year").value),visited=$("fVisited").value==="true",a=$("fAgri").value;
  const payload={plot_id:selected.id,tax_year:y,visited,is_agricultural:a===""?null:a==="true",inspection_date:$("fDate").value||null,inspector_name:$("fInspector").value.trim()||null,notes:$("fNotes").value.trim()||null,updated_at:new Date().toISOString()};
  const {data,error}=await db.from("inspections").upsert(payload,{onConflict:"plot_id,tax_year"}).select().single();
  if(error){showMsg("บันทึกไม่สำเร็จ: "+error.message);return;}
  const files=[...($("fPhotos").files||[])];
  for(const file of files){
    const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const path=selected.plot_code+"/"+y+"/"+crypto.randomUUID()+"-"+safe;
    const up=await db.storage.from("inspection-photos").upload(path,file);
    if(up.error){showMsg("บันทึกรายการแล้ว แต่แนบรูปไม่สำเร็จ: "+up.error.message);continue;}
    const pi=await db.from("inspection_photos").insert({inspection_id:data.id,storage_path:path,file_name:file.name});
    if(pi.error){showMsg("บันทึกรายการแล้ว แต่บันทึกข้อมูลรูปไม่สำเร็จ: "+pi.error.message);}
  }
  showMsg("บันทึกข้อมูลปี "+y+" เรียบร้อยแล้ว","success");
  await loadInspections();
}
init();
</script>
</body>
</html>

<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ระบบติดตามแปลงเกษตร เขตประเวศ</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Thai",sans-serif;background:#f4f7f5;color:#173b2a}header{background:#176b43;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{margin:0;font-size:21px}.wrap{max-width:1400px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #dce7e0;border-radius:14px;padding:16px;box-shadow:0 2px 10px #0000000a}.login{max-width:440px;margin:60px auto}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}#map{height:540px;border-radius:10px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:9px;border:1px solid #cbd8d0;border-radius:8px;background:#fff}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;background:#176b43;color:#fff}button.secondary{background:#e8f0eb;color:#174c35}label{display:block;font-size:13px;font-weight:700;margin:9px 0 5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.stat{padding:13px;border-radius:10px;background:#eef6f1}.stat b{font-size:24px;display:block}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:700}.ok{background:#dff3e7;color:#176b43}.wait{background:#fff0d4;color:#8a5b00}.no{background:#f8dddd;color:#9a2929}.hidden{display:none!important}.muted{color:#60756a;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #e5ece8;text-align:left}.error{background:#fff0f0;color:#9a2929;padding:10px;border-radius:8px;margin:8px 0}.success{background:#e9f8ef;color:#176b43;padding:10px;border-radius:8px;margin:8px 0}.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.photo{width:110px;height:80px;object-fit:cover;border-radius:8px;border:1px solid #ddd}@media(max-width:900px){.grid{grid-template-columns:1fr}#map{height:420px}.stats{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>🌾 ระบบติดตามแปลงเกษตร เขตประเวศ</h1><div id="userArea"></div></header><div id="loginView" class="wrap"><div class="card login"><h2>เข้าสู่ระบบ</h2><p class="muted">ระบบกลางสำหรับเจ้าหน้าที่หลายคน</p><div id="authMsg"></div><label>อีเมล</label><input id="email" type="email" placeholder="name@example.com"><label>รหัสผ่าน</label><input id="password" type="password" placeholder="อย่างน้อย 6 ตัวอักษร"><div class="toolbar" style="margin-top:14px"><button onclick="signIn()">เข้าสู่ระบบ</button><button class="secondary" onclick="signUp()">สร้างบัญชี</button></div></div></div><div id="appView" class="wrap hidden"><div class="stats"><div class="stat">แปลงทั้งหมด<b id="sTotal">0</b></div><div class="stat">ตรวจแล้ว<b id="sVisited">0</b></div><div class="stat">ยังเป็นเกษตร<b id="sAgri">0</b></div><div class="stat">รอตรวจ<b id="sWait">0</b></div></div><div class="toolbar"><select id="year" style="width:150px" onchange="refreshYear()"></select><input id="search" style="max-width:280px" placeholder="ค้นหารหัสแปลง / เลขเอกสารสิทธิ์" oninput="renderPlotList()"><button class="secondary" onclick="loadAll()">↻ รีเฟรชข้อมูล</button></div><div class="grid"><div class="card"><h3>🗺️ แผนที่แปลงเกษตร</h3><div id="map"></div><div id="plotList" style="margin-top:12px"></div></div><div class="card"><h3 id="detailTitle">เลือกแปลงจากแผนที่</h3><div id="detail"></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const U="https://zcyymemnbvodhayehkdn.supabase.co",K="sb_publishable_XVP0B8KvPBFyZtIi_K3z4A_cRTTmAGH",sb=supabase.createClient(U,K),YEARS=[2568,2569,2570,2571,2572];const $=id=>document.getElementById(id);const loginView=$('loginView'),appView=$('appView'),userArea=$('userArea'),authMsg=$('authMsg'),email=$('email'),password=$('password'),year=$('year'),search=$('search'),plotList=$('plotList'),detail=$('detail'),detailTitle=$('detailTitle'),sTotal=$('sTotal'),sVisited=$('sVisited'),sAgri=$('sAgri'),sWait=$('sWait');let plots=[],inspections=[],selected=null,map,markers=[];year.innerHTML=YEARS.map(y=>`<option value="${y}" ${y==2569?'selected':''}>ปีภาษี ${y}</option>`).join('');sb.auth.onAuthStateChange((e,s)=>{ if(s) showApp(); else showLogin(); }); setTimeout(async()=>{const {data:{session}}=await sb.auth.getSession(); if(session) showApp(); else showLogin();},0);async function signIn(){authMsg.innerHTML='';const em=email.value.trim(),pw=password.value;if(!em||!pw)return authMsg.innerHTML='<div class="error">กรุณากรอกอีเมลและรหัสผ่าน</div>';const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error){let msg=error.message;if(error.message.toLowerCase().includes('email not confirmed'))msg='อีเมลยังไม่ได้ยืนยัน กรุณาเปิดอีเมลจาก Supabase แล้วกดยืนยันก่อนเข้าสู่ระบบ';else if(error.message.toLowerCase().includes('invalid login credentials'))msg='อีเมลหรือรหัสผ่านไม่ถูกต้อง หากยังไม่มีบัญชี ให้กด “สร้างบัญชี” ก่อน';authMsg.innerHTML=`<div class="error">${esc(msg)}</div>`}}async function signUp(){authMsg.innerHTML='';const em=email.value.trim(),pw=password.value;if(!em||!pw)return authMsg.innerHTML='<div class="error">กรุณากรอกอีเมลและรหัสผ่านก่อนสร้างบัญชี</div>';if(pw.length<6)return authMsg.innerHTML='<div class="error">รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร</div>';const{data,error}=await sb.auth.signUp({email:em,password:pw});if(error){authMsg.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}if(data.session){authMsg.innerHTML='<div class="success">สร้างบัญชีและเข้าสู่ระบบแล้ว</div>'}else{authMsg.innerHTML='<div class="success">สร้างบัญชีแล้ว หากระบบเปิดการยืนยันอีเมล กรุณาตรวจอีเมลและกดยืนยันก่อนเข้าสู่ระบบ</div>'}}async function signOut(){await sb.auth.signOut()}function showLogin(){loginView.classList.remove('hidden');appView.classList.add('hidden');userArea.innerHTML=''}async function showApp(){loginView.classList.add('hidden');appView.classList.remove('hidden');const{data:{user}}=await sb.auth.getUser();userArea.innerHTML=`${esc(user?.email||'')} <button class="secondary" onclick="signOut()">ออกจากระบบ</button>`;if(!map){map=L.map('map').setView([13.6748,100.687],14);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}).addTo(map)}await loadAll()}async function loadAll(){const{data,error}=await sb.from('plots').select('*').order('plot_code');if(error)return detail.innerHTML=`<div class="error">${esc(error.message)}</div>`;plots=data||[];await refreshYear()}async function refreshYear(){const y=+year.value;const{data,error}=await sb.from('inspections').select('*').eq('tax_year',y);if(error)return;inspections=data||[];renderMap();renderPlotList();renderStats();if(selected)openPlot(selected.id)}function statusText(i){return!i||!i.visited?'ยังไม่ได้ลงพื้นที่':i.is_agricultural?'ตรวจแล้ว • ยังเป็นเกษตร':'ตรวจแล้ว • ไม่เป็นเกษตร'}function badge(i){const c=!i||!i.visited?'wait':i.is_agricultural?'ok':'no';return`<span class="badge ${c}">${statusText(i)}</span>`}function renderMap(){markers.forEach(m=>m.remove());markers=[];const b=[];plots.forEach(p=>{if(p.latitude==null)return;const i=inspections.find(x=>x.plot_id===p.id),c=!i||!i.visited?'#d49a19':i.is_agricultural?'#176b43':'#a83d3d',m=L.circleMarker([p.latitude,p.longitude],{radius:9,color:c,fillColor:c,fillOpacity:.8});m.bindPopup(`<b>${p.plot_code}</b><br>${statusText(i)}`);m.on('click',()=>openPlot(p.id));m.addTo(map);markers.push(m);b.push([p.latitude,p.longitude])});if(b.length)map.fitBounds(b,{padding:[20,20]})}function renderPlotList(){const q=(search.value||'').toLowerCase(),list=plots.filter(p=>(p.plot_code+' '+(p.title_deed_no||'')).toLowerCase().includes(q));plotList.innerHTML=`<table><tr><th>แปลง</th><th>เอกสารสิทธิ์</th><th>สถานะ</th></tr>${list.map(p=>{const i=inspections.find(x=>x.plot_id===p.id);return`<tr onclick="openPlot('${p.id}')" style="cursor:pointer"><td><b>${p.plot_code}</b></td><td>${p.title_deed_no||'-'}</td><td>${badge(i)}</td></tr>`}).join('')}</table>`}function renderStats(){const v=inspections.filter(i=>i.visited).length,a=inspections.filter(i=>i.visited&&i.is_agricultural).length;sTotal.textContent=plots.length;sVisited.textContent=v;sAgri.textContent=a;sWait.textContent=plots.length-v}function areaText(p){return`${p.area_rai||0}-${p.area_ngan||0}-${p.area_wah||0}`}async function openPlot(id){selected=plots.find(p=>p.id===id);const y=+year.value;const[{data:i},{data:h}]=await Promise.all([sb.from('inspections').select('*').eq('plot_id',id).eq('tax_year',y).maybeSingle(),sb.from('inspections').select('*').eq('plot_id',id).order('tax_year',{ascending:false})]);const x=i||{plot_id:id,tax_year:y,visited:false,is_agricultural:null};detailTitle.textContent=`แปลง ${selected.plot_code} • ปีภาษี ${y}`;detail.innerHTML=`<div class="success">${badge(x)}</div><div class="row"><div><label>รหัสแปลง</label><input value="${selected.plot_code}" disabled></div><div><label>เลขเอกสารสิทธิ์</label><input value="${selected.title_deed_no||''}" disabled></div></div><div class="row"><div><label>เนื้อที่ (ไร่-งาน-ตร.ว.)</label><input value="${areaText(selected)}" disabled></div><div><label>การใช้ประโยชน์</label><input value="${selected.land_use||''}" disabled></div></div><label>ลงพื้นที่ตรวจแล้วหรือยัง</label><select id="visited"><option value="false" ${!x.visited?'selected':''}>ยังไม่ได้ลงพื้นที่</option><option value="true" ${x.visited?'selected':''}>ลงพื้นที่แล้ว</option></select><label>สถานะการเกษตร</label><select id="agri"><option value="" ${x.is_agricultural==null?'selected':''}>ยังไม่ระบุ</option><option value="true" ${x.is_agricultural===true?'selected':''}>ยังเป็นเกษตร</option><option value="false" ${x.is_agricultural===false?'selected':''}>ไม่เป็นเกษตร</option></select><div class="row"><div><label>วันที่ตรวจ</label><input id="date" type="date" value="${x.inspection_date||''}"></div><div><label>ผู้ตรวจ</label><input id="inspector" value="${esc(x.inspector_name||'')}"></div></div><label>หมายเหตุ</label><textarea id="notes">${esc(x.notes||'')}</textarea><label>แนบรูปถ่ายปี ${y}</label><input id="photos" type="file" accept="image/*" multiple><div id="photoList" class="photos"></div><div class="toolbar" style="margin-top:12px"><button onclick="saveInspection()">💾 บันทึกข้อมูลปี ${y}</button><button class="secondary" onclick="openMaps()">📍 Google Maps</button></div><hr><h4>ประวัติย้อนหลัง</h4><table><tr><th>ปี</th><th>สถานะ</th><th>วันที่</th><th>ผู้ตรวจ</th></tr>${(h||[]).map(z=>`<tr><td>${z.tax_year}</td><td>${statusText(z)}</td><td>${z.inspection_date||'-'}</td><td>${esc(z.inspector_name||'-')}</td></tr>`).join('')}</table>`;await loadPhotos(x.id)}async function loadPhotos(id){if(!id){photoList.innerHTML='<span class="muted">บันทึกผลตรวจก่อนจึงจะแนบรูปได้</span>';return}const{data}=await sb.from('inspection_photos').select('*').eq('inspection_id',id).order('uploaded_at');photoList.innerHTML='';for(const p of(data||[])){const{data:u}=await sb.storage.from('inspection-photos').createSignedUrl(p.storage_path,3600);if(u?.signedUrl)photoList.innerHTML+=`<a href="${u.signedUrl}" target="_blank"><img class="photo" src="${u.signedUrl}"></a>`}if(!data?.length)photoList.innerHTML='<span class="muted">ยังไม่มีรูป</span>'}async function saveInspection(){const y=+year.value,ag=agri.value,payload={plot_id:selected.id,tax_year:y,visited:visited.value==='true',is_agricultural:ag===''?null:ag==='true',inspection_date:date.value||null,inspector_name:inspector.value.trim()||null,notes:notes.value.trim()||null,updated_at:new Date().toISOString()};const{data,error}=await sb.from('inspections').upsert(payload,{onConflict:'plot_id,tax_year'}).select().single();if(error)return detail.innerHTML=`<div class="error">${esc(error.message)}</div>`;for(const f of photos.files){const path=`${selected.plot_code}/${y}/${crypto.randomUUID()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`,u=await sb.storage.from('inspection-photos').upload(path,f);if(!u.error)await sb.from('inspection_photos').insert({inspection_id:data.id,storage_path:path,file_name:f.name})}alert('บันทึกข้อมูลเรียบร้อย');await refreshYear()}function openMaps(){window.open(`https://www.google.com/maps?q=${selected.latitude},${selected.longitude}`,'_blank')}password.addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});email.addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
